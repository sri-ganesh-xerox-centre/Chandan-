<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Ganesh Xerox Centre - Reviews</title>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

h2{
  color:gold;
  margin-top:40px;
}

.section{
  padding:40px 20px;
}

.feedback-box{
  max-width:500px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.feedback-box input,
.feedback-box textarea{
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

textarea{
  height:100px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.submit-btn{
  background:gold;
  color:black;
}

.google-btn{
  background:#ffffff;
  color:black;
}

.admin-btn{
  background:red;
  color:white;
  margin-top:20px;
}

.star-rating{
  font-size:30px;
  cursor:pointer;
  color:gray;
}

.star-rating span.active{
  color:gold;
}

.avg-rating{
  margin-bottom:20px;
  font-size:18px;
}

.carousel{
  max-width:600px;
  margin:30px auto;
  overflow:hidden;
}

.review-slider{
  display:flex;
  transition:0.5s;
}

.review-card{
  min-width:100%;
  background:#111;
  padding:20px;
  border-radius:15px;
  box-shadow:0 0 15px rgba(255,215,0,0.3);
}

.review-card h3{
  color:gold;
}

.review-card button{
  background:red;
  color:white;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="section">

<h2>⭐ Customer Reviews</h2>

<div class="avg-rating">
Average Rating: <span id="avgRating">0</span> ⭐
</div>

<div class="feedback-box">

<input type="text" id="custName" placeholder="Your Name">
<input type="number" id="custMobile" placeholder="Mobile Number">

<div class="star-rating">
  <span onclick="rate(1)">★</span>
  <span onclick="rate(2)">★</span>
  <span onclick="rate(3)">★</span>
  <span onclick="rate(4)">★</span>
  <span onclick="rate(5)">★</span>
</div>

<textarea id="custMessage" placeholder="Write your feedback..."></textarea>

<button class="submit-btn" onclick="submitFeedback()">Submit Review</button>

<a href="https://g.page/r/YOUR_GOOGLE_REVIEW_LINK" target="_blank">
<button class="google-btn">Rate Us on Google</button>
</a>

</div>

<div class="carousel">
  <div id="reviewSlider" class="review-slider"></div>
</div>

<button class="admin-btn" onclick="adminLogin()">Admin Panel</button>

</div>

<script>

let selectedRating = 0;
let currentSlide = 0;

function rate(stars){
  selectedRating = stars;
  let starsEl = document.querySelectorAll(".star-rating span");
  starsEl.forEach((star,index)=>{
    star.classList.toggle("active", index < stars);
  });
}

function submitFeedback(){
  let name = document.getElementById("custName").value;
  let mobile = document.getElementById("custMobile").value;
  let message = document.getElementById("custMessage").value;

  if(name==="" || mobile==="" || message==="" || selectedRating===0){
    alert("Please fill all fields");
    return;
  }

  let review = {
    id: Date.now(),
    name,
    rating:selectedRating,
    message
  };

  let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
  reviews.push(review);
  localStorage.setItem("reviews", JSON.stringify(reviews));

  sendToWhatsApp(name, selectedRating, message);

  displayReviews();
  calculateAverage();

  document.getElementById("custName").value="";
  document.getElementById("custMobile").value="";
  document.getElementById("custMessage").value="";
  rate(0);
}

function displayReviews(){
  let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
  let slider = document.getElementById("reviewSlider");
  slider.innerHTML="";

  reviews.forEach(r=>{
    slider.innerHTML += `
      <div class="review-card">
        <h3>${r.name}</h3>
        <p>${"★".repeat(r.rating)}</p>
        <p>${r.message}</p>
        <button onclick="deleteReview(${r.id})">Delete</button>
      </div>
    `;
  });
}

function calculateAverage(){
  let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
  if(reviews.length===0){
    document.getElementById("avgRating").innerText="0";
    return;
  }

  let total = reviews.reduce((sum,r)=>sum+r.rating,0);
  let avg = (total/reviews.length).toFixed(1);
  document.getElementById("avgRating").innerText=avg;
}

function sendToWhatsApp(name,rating,message){
  let text = encodeURIComponent(
    "Customer Review\n\n"+
    "Name: "+name+"\n"+
    "Rating: "+rating+" Stars\n"+
    "Message: "+message
  );
  window.open("https://wa.me/918917699445?text="+text,"_blank");
}

function adminLogin(){
  let pass = prompt("Enter Admin Password");
  if(pass==="admin123"){
    alert("Admin Mode Activated");
  }else{
    alert("Wrong Password");
  }
}

function deleteReview(id){
  let pass = prompt("Enter Admin Password to Delete");
  if(pass!=="admin123"){
    alert("Wrong Password");
    return;
  }

  let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
  reviews = reviews.filter(r=>r.id!==id);
  localStorage.setItem("reviews", JSON.stringify(reviews));
  displayReviews();
  calculateAverage();
}

function autoSlide(){
  let slider = document.getElementById("reviewSlider");
  let total = slider.children.length;
  if(total===0) return;

  currentSlide++;
  if(currentSlide>=total) currentSlide=0;

  slider.style.transform = `translateX(-${currentSlide*100}%)`;
}

setInterval(autoSlide,3000);

displayReviews();
calculateAverage();

</script>

</body>
</html>
