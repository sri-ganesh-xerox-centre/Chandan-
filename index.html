<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Ganesh Xerox Centre - Paralakhemundi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html{scroll-behavior:smooth;}
body{
  background:linear-gradient(135deg,#000,#1a1a1a,#000);
  color:white;
  animation:fadeInBody 1.2s ease-in;
}
@keyframes fadeInBody{from{opacity:0;}to{opacity:1;}}

.gold{
  background:linear-gradient(45deg,#FFD700,#ffb347,#FFD700);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

header{text-align:center;padding:60px 20px;}
header img{
  width:95%;
  max-width:1000px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(255,215,0,0.7);
  transition:0.4s;
}
header img:hover{transform:scale(1.02);}
header p{margin-top:8px;color:#ddd;}

.section{padding:80px 20px;text-align:center;background:#111;}
.section h2{margin-bottom:40px;font-size:32px;}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:30px;
}

.card{
  background:linear-gradient(135deg,#222,#111);
  border:1px solid #FFD700;
  width:260px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(255,215,0,0.3);
  transition:0.4s;
  text-decoration:none;
  color:white;
  cursor:pointer;
}
.card:hover{
  transform:translateY(-12px) scale(1.04);
  box-shadow:0 0 60px rgba(255,215,0,0.9);
}

button{
  background:linear-gradient(45deg,#FFD700,#ffb347);
  border:none;
  padding:12px 25px;
  border-radius:30px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}
button:hover{
  transform:scale(1.08);
  box-shadow:0 0 25px #FFD700;
}

input,select{
  margin:8px;
  padding:10px;
  border-radius:15px;
  border:none;
  width:200px;
}

#totalResult{
  margin-top:20px;
  font-size:20px;
  animation:fadeResult 0.6s ease-in-out;
}
@keyframes fadeResult{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

footer{
  text-align:center;
  padding:25px;
  background:#111;
  color:#aaa;
}

@media(max-width:600px){
  .container{flex-direction:column;}
  input,select{width:100%;}
}
</style>
</head>

<body>

<header>
<img src="logo.jpg">
<h1 class="gold">Sri Ganesh Xerox Centre</h1>
<p>Fast • Affordable • Trusted Service in Paralakhemundi</p>
</header>

<section class="section">
<h2 class="gold">Our Services</h2>
<div class="container">

<div class="card">🖥 Online Form Fillup<br><br>₹150</div>
<div class="card">📄 Xerox ₹2</div>
<div class="card">🖨 B/W Print ₹5</div>
<div class="card">🎨 Colour Print ₹10</div>
<div class="card">📑 Lamination ₹30</div>
<div class="card">📸 Passport Photo ₹50</div>

</div>
</section>

<section class="section">
<h2 class="gold">Price Calculator</h2>

<input type="number" id="xeroxQty" placeholder="Xerox Qty">
<input type="number" id="bwQty" placeholder="B/W Qty">
<input type="number" id="colorQty" placeholder="Colour Qty"><br>

<select id="dtpType">
<option value="50">DTP English ₹50</option>
<option value="80">DTP Odia ₹80</option>
</select>
<input type="number" id="dtpQty" placeholder="DTP Qty"><br>

<input type="number" id="lamQty" placeholder="Lamination Qty"><br>

<button onclick="calculateTotal()">Calculate Total</button>

<h3 id="totalResult"></h3>

</section>

<footer>
© 2026 Sri Ganesh Xerox Centre | All Rights Reserved
</footer>

<script>
function calculateTotal(){
let total=0;
total+=(parseInt(xeroxQty.value)||0)*2;
total+=(parseInt(bwQty.value)||0)*5;
total+=(parseInt(colorQty.value)||0)*10;
total+=(parseInt(dtpQty.value)||0)*parseInt(dtpType.value);
total+=(parseInt(lamQty.value)||0)*30;

let discount=0;
if(total>500) discount=total*0.1;

totalResult.innerHTML=
"Total: ₹"+total+
"<br>Discount: ₹"+discount+
"<br><strong>Final: ₹"+(total-discount)+"</strong>";
}
</script>

</body>
</html>
