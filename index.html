<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Ganesh Xerox Centre</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
scroll-behavior:smooth;
}

body{
background: linear-gradient(135deg,#ff9933,#ff512f,#dd2476);
background-size:400% 400%;
animation:bgMove 8s ease infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
text-align:center;
padding:40px 20px;
background:white;
}

header img{
width:95%;
max-width:1000px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

.section{
padding:60px 20px;
background:white;
color:#333;
text-align:center;
}

.section h2{
margin-bottom:30px;
font-size:30px;
}

.services{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#fff;
width:260px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
transition:0.4s;
font-weight:500;
}

.card:hover{
transform:translateY(-12px) scale(1.05);
box-shadow:0 20px 40px rgba(0,0,0,0.25);
}

.contact{
padding:60px 20px;
text-align:center;
}

.contact a{
display:inline-block;
margin:10px;
padding:14px 30px;
background:#25D366;
color:white;
border-radius:40px;
text-decoration:none;
font-weight:600;
transition:0.3s;
}

.contact a:hover{
transform:scale(1.1);
}

footer{
text-align:center;
padding:20px;
background:#111;
font-size:14px;
}

/* Floating WhatsApp */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px 18px;
border-radius:50%;
font-size:22px;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(37,211,102,0.7);}
70%{box-shadow:0 0 0 15px rgba(37,211,102,0);}
100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}
}
</style>
</head>

<body>

<header>
<img src="logo.jpg">
</header>

<section class="section">
<h2>Our Services</h2>
<div class="services">
<div class="card">📄 Xerox & Printing</div>
<div class="card">🎨 Colour Printouts</div>
<div class="card">📑 Lamination</div>
<div class="card">🖨 Online Form Fillup</div>
<div class="card">📸 Photo Print</div>
<div class="card">📂 Spiral Binding</div>
</div>
</section>

<section class="contact">
<h2>Contact Us</h2>
<p>📞 +91 8917699445</p>
<a href="https://wa.me/918917699445">Chat on WhatsApp</a>
<a href="https://maps.app.goo.gl/xa3WznAaykD7ukt89" style="background:#ff512f;">Shop Location</a>
</section>

<footer>
© 2026 Sri Ganesh Xerox Centre | All Rights Reserved
</footer>

<a class="whatsapp" href="https://wa.me/918917699445">💬</a>

</body>
</html>
